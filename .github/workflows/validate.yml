name: Validate repository

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20"
          - "24"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Check repository and install contracts
        run: npm test

  publish-reviewed-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: repository-contract
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Resolve a reviewed release record changed by this commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git switch -C main --track origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --tags --force origin

          mapfile -t release_records < <(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
              grep -E '^docs/releases/v[0-9]+\.[0-9]+\.[0-9]+\.md$' || true
          )

          if [ "${#release_records[@]}" -eq 0 ]; then
            printf 'publish=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#release_records[@]}" -ne 1 ]; then
            printf '%s\n' "Expected at most one versioned release record in a publication commit; found ${#release_records[@]}." >&2
            exit 1
          fi

          release_record="${release_records[0]}"
          tag="$(basename "$release_record" .md)"
          test "$(head -n 1 "$release_record")" = "# Dwi $tag"

          if ! grep -Fxq 'Release status: approved for publication' "$release_record"; then
            printf 'publish=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'publish=true\n' >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'release_record=%s\n' "$release_record" >> "$GITHUB_OUTPUT"

      - name: Validate release gates
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          npm run check

          section="$({
            sed -n "/^## Blocking gates for ${TAG}$/,/^## /p" docs/release-checklist.md
          } | sed '$d')"

          test -n "$section"
          if grep -F -- "- [ ]" <<<"$section"; then
            printf '%s\n' "One or more ${TAG} release gates remain open." >&2
            exit 1
          fi

      - name: Inspect local release ref
        id: tag_state
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
            printf 'before=%s\n' "$(git rev-parse "${TAG}^{commit}")" >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
            printf 'before=none\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Create local immutable release ref
        if: steps.release.outputs.publish == 'true' && steps.tag_state.outputs.exists == 'false'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git update-ref "refs/tags/$TAG" "$GITHUB_SHA"

      - name: Verify local immutable release ref
        id: tag_verify
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse "${TAG}^{commit}")"
          printf 'actual=%s\n' "$actual" >> "$GITHUB_OUTPUT"
          printf 'expected=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          test "$actual" = "$GITHUB_SHA"

      - name: Run public-release preflight against local tag
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run preflight:public 2>&1 | tee /tmp/dwi-public-release-preflight.log

      - name: Push immutable release tag
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          git push origin "refs/tags/$TAG"

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_RECORD: ${{ steps.release.outputs.release_record }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG"
            exit 0
          fi
          gh release create "$TAG" \
            --verify-tag \
            --latest \
            --title "Dwi $TAG" \
            --notes-file "$RELEASE_RECORD"
          gh release view "$TAG"

      - name: Report reviewed release publication result
        if: always() && steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          JOB_STATUS: ${{ job.status }}
          TAG_EXISTED: ${{ steps.tag_state.outputs.exists }}
          TAG_BEFORE: ${{ steps.tag_state.outputs.before }}
          TAG_ACTUAL: ${{ steps.tag_verify.outputs.actual }}
          TAG_EXPECTED: ${{ steps.tag_verify.outputs.expected }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          {
            printf '### Reviewed release publication\n\n'
            printf -- '- Tag: `%s`\n' "$TAG"
            printf -- '- Job status: `%s`\n' "$JOB_STATUS"
            printf -- '- Workflow run ID: `%s`\n' "$GITHUB_RUN_ID"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Local tag existed before preparation: `%s`\n' "${TAG_EXISTED:-unknown}"
            printf -- '- Local tag target before preparation: `%s`\n' "${TAG_BEFORE:-unknown}"
            printf -- '- Local tag target after preparation: `%s`\n' "${TAG_ACTUAL:-unknown}"
            printf -- '- Expected tag target: `%s`\n' "${TAG_EXPECTED:-$GITHUB_SHA}"
            if [ -f /tmp/dwi-public-release-preflight.log ]; then
              printf '\n<details><summary>Public-release preflight tail</summary>\n\n```text\n'
              tail -n 100 /tmp/dwi-public-release-preflight.log
              printf '\n```\n</details>\n'
            fi
          } > "$body_file"
          gh pr comment 5 --body-file "$body_file"

  public-release-preflight:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Align a tag checkout with main
        if: github.ref_type == 'tag'
        run: |
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git switch -C main --track origin/main
          test "$(git rev-parse HEAD)" = "$TAG_COMMIT"
      - name: Run public-release preflight
        run: npm run preflight:public
